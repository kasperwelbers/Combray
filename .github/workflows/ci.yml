name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r --filter '!@combray/server' test
      - run: pnpm --filter @combray/web build
      # The key page must build to the same bytes every time, so its release hash can be checked.
      - name: Build the key page twice and compare
        run: |
          pnpm --filter @combray/keys build
          first=$(cat apps/keys/dist/index.html.sha256)
          rm -rf apps/keys/dist
          pnpm --filter @combray/keys build
          test "$first" = "$(cat apps/keys/dist/index.html.sha256)"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @combray/keys exec playwright install --with-deps chromium
      - run: pnpm --filter @combray/web build
      - run: pnpm --filter @combray/keys build
      - run: pnpm --filter @combray/keys e2e

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The server's HTTP tests start a real server per test (apps/server/test).
      - run: pnpm --filter @combray/server test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: combray-server:ci
