# Combray server: serves the web client, project configs and the store key service.
# See docs/deployment.md. From this directory, once:
#
#   mkdir -p secrets combray-data && cp -r examples/projects combray-data/
#   head -c 32 /dev/urandom > secrets/store-master.key && chmod 600 secrets/store-master.key
#
# Back up secrets/store-master.key separately from combray-data. Then:
#
#   COMBRAY_DOMAIN=combray.example.edu docker compose up -d
#
# Without COMBRAY_DOMAIN, Caddy serves https://localhost with a local certificate.
services:
  combray:
    build:
      context: ..
      dockerfile: Dockerfile
    image: combray-server:dev
    restart: unless-stopped
    environment:
      RUST_LOG: info
      # Caddy sets this; its last entry is the real client IP, used only for rate limiting.
      COMBRAY_CLIENT_IP_HEADER: x-forwarded-for
      # Used by `combray-server reset-link` to print full links.
      COMBRAY_PUBLIC_URL: https://${COMBRAY_DOMAIN:-localhost}
    secrets: [combray_store_master_key]
    volumes:
      # Project configs in ./combray-data/projects/{id}.json; store key records in
      # ./combray-data/combray.sqlite (no keys in it without the store master key).
      - ./combray-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["8080"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      COMBRAY_DOMAIN: ${COMBRAY_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [combray]

secrets:
  combray_store_master_key:
    file: ./secrets/store-master.key

volumes:
  caddy-data:
  caddy-config:
