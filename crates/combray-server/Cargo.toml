[package]
name = "combray-server"
description = "The shared Combray server: web client, project configs, store keys, researcher sign-in and donations"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.6.0"
hkdf = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
subtle = "2.6.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
regex = "1.13.1"
# conditional-ui: discoverable passkey sign-in (start/identify/finish_discoverable_authentication).
webauthn-rs = { version = "0.6", features = ["conditional-ui"] }
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-native-tls", "hostname"] }
url = "2.5.8"
tower = { version = "0.5", features = ["util"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"

[lints]
workspace = true
